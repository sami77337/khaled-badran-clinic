<div
    class="booking-phone-control"
    data-booking-phone-control
    data-booking-phone-key="{{ control_key }}"
    data-booking-default-dial-code="+962"
>
    <div class="booking-phone-row" dir="ltr">
        <button
            class="booking-country-trigger"
            type="button"
            aria-label="{% if is_arabic %}اختيار رمز الدولة{% else %}Choose country code{% endif %}"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="booking-country-options-{{ control_key }}"
            data-booking-country-trigger
        >
            <span class="booking-country-flag" aria-hidden="true" data-booking-country-flag>🇯🇴</span>
            <span class="booking-country-dial" dir="ltr" data-booking-country-dial>+962</span>
            <span class="booking-country-chevron" aria-hidden="true">⌄</span>
        </button>
        {{ field }}
    </div>

    <div class="booking-country-menu" data-booking-country-menu hidden>
        <label class="booking-country-search-label" for="booking-country-search-{{ control_key }}">
            {% if is_arabic %}ابحث عن دولة أو رمز{% else %}Search country or code{% endif %}
        </label>
        <input
            class="booking-country-search"
            id="booking-country-search-{{ control_key }}"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="{% if is_arabic %}ابحث...{% else %}Search...{% endif %}"
            data-booking-country-search
        >
        <div
            class="booking-country-options"
            id="booking-country-options-{{ control_key }}"
            role="listbox"
            aria-label="{% if is_arabic %}رموز الاتصال الدولية{% else %}International dialing codes{% endif %}"
            data-booking-country-options
        >
            <button type="button" role="option" aria-selected="true" data-booking-country-option data-country-code="JO" data-country-dial="+962" data-country-flag="🇯🇴" data-country-search="Jordan الأردن +962"><span aria-hidden="true">🇯🇴</span><span>{% if is_arabic %}الأردن{% else %}Jordan{% endif %}</span><bdi>+962</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="SA" data-country-dial="+966" data-country-flag="🇸🇦" data-country-search="Saudi Arabia السعودية +966"><span aria-hidden="true">🇸🇦</span><span>{% if is_arabic %}السعودية{% else %}Saudi Arabia{% endif %}</span><bdi>+966</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="AE" data-country-dial="+971" data-country-flag="🇦🇪" data-country-search="United Arab Emirates UAE الإمارات +971"><span aria-hidden="true">🇦🇪</span><span>{% if is_arabic %}الإمارات{% else %}UAE{% endif %}</span><bdi>+971</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="QA" data-country-dial="+974" data-country-flag="🇶🇦" data-country-search="Qatar قطر +974"><span aria-hidden="true">🇶🇦</span><span>{% if is_arabic %}قطر{% else %}Qatar{% endif %}</span><bdi>+974</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="KW" data-country-dial="+965" data-country-flag="🇰🇼" data-country-search="Kuwait الكويت +965"><span aria-hidden="true">🇰🇼</span><span>{% if is_arabic %}الكويت{% else %}Kuwait{% endif %}</span><bdi>+965</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="OM" data-country-dial="+968" data-country-flag="🇴🇲" data-country-search="Oman عُمان +968"><span aria-hidden="true">🇴🇲</span><span>{% if is_arabic %}عُمان{% else %}Oman{% endif %}</span><bdi>+968</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="BH" data-country-dial="+973" data-country-flag="🇧🇭" data-country-search="Bahrain البحرين +973"><span aria-hidden="true">🇧🇭</span><span>{% if is_arabic %}البحرين{% else %}Bahrain{% endif %}</span><bdi>+973</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="IQ" data-country-dial="+964" data-country-flag="🇮🇶" data-country-search="Iraq العراق +964"><span aria-hidden="true">🇮🇶</span><span>{% if is_arabic %}العراق{% else %}Iraq{% endif %}</span><bdi>+964</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="PS" data-country-dial="+970" data-country-flag="🇵🇸" data-country-search="Palestine فلسطين +970"><span aria-hidden="true">🇵🇸</span><span>{% if is_arabic %}فلسطين{% else %}Palestine{% endif %}</span><bdi>+970</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="EG" data-country-dial="+20" data-country-flag="🇪🇬" data-country-search="Egypt مصر +20"><span aria-hidden="true">🇪🇬</span><span>{% if is_arabic %}مصر{% else %}Egypt{% endif %}</span><bdi>+20</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="LB" data-country-dial="+961" data-country-flag="🇱🇧" data-country-search="Lebanon لبنان +961"><span aria-hidden="true">🇱🇧</span><span>{% if is_arabic %}لبنان{% else %}Lebanon{% endif %}</span><bdi>+961</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="US" data-country-dial="+1" data-country-flag="🇺🇸" data-country-search="United States US الولايات المتحدة +1"><span aria-hidden="true">🇺🇸</span><span>{% if is_arabic %}الولايات المتحدة{% else %}US{% endif %}</span><bdi>+1</bdi></button>
            <button type="button" role="option" aria-selected="false" data-booking-country-option data-country-code="GB" data-country-dial="+44" data-country-flag="🇬🇧" data-country-search="United Kingdom UK المملكة المتحدة +44"><span aria-hidden="true">🇬🇧</span><span>{% if is_arabic %}المملكة المتحدة{% else %}UK{% endif %}</span><bdi>+44</bdi></button>
        </div>
        <p class="booking-country-empty" data-booking-country-empty hidden>
            {% if is_arabic %}لا توجد نتائج مطابقة.{% else %}No matching countries.{% endif %}
        </p>
    </div>
</div>
