<nav class="booking-steps" aria-label="{% if is_arabic %}خطوات الحجز{% else %}Booking steps{% endif %}" data-booking-progress>
    <ol>
        {% for key, label in booking_steps %}
            <li class="booking-step{% if active_step == key %} is-active{% endif %}{% if active_step == 'slot' and key == 'visit_type' %} is-complete{% elif active_step == 'confirm' and key != 'confirm' %} is-complete{% endif %}"{% if active_step == key %} aria-current="step"{% endif %}>
                <span class="booking-step-marker" aria-hidden="true">
                    {% if active_step == 'slot' and key == 'visit_type' %}✓{% elif active_step == 'confirm' and key != 'confirm' %}✓{% else %}{{ forloop.counter }}{% endif %}
                </span>
                <span class="booking-step-label">{{ label }}</span>
            </li>
        {% endfor %}
    </ol>
</nav>
