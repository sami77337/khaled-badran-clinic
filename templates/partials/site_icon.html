{% load static branding %}
{% approved_logo_path as kb_logo %}

<link rel="icon" href="{% static kb_logo %}" type="image/png">
<link rel="apple-touch-icon" href="{% static kb_logo %}">
{% else %}
<link rel="icon" href="{% static 'img/icons/site-icon.svg' %}" type="image/svg+xml">
{% endif %}
