name: Dependency audit

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Weekly advisory-backed dependency evidence. This does not upgrade packages.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit requirements
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependency audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit Python requirements
        run: pip-audit -r requirements.txt --progress-spinner off
