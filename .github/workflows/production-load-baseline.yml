name: Bounded production load baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/production-load-baseline.yml"

permissions:
  contents: read

concurrency:
  group: bounded-production-load
  cancel-in-progress: false

jobs:
  public-read-only:
    name: Small-clinic public GET baseline
    runs-on: ubuntu-latest

    steps:
      - name: Run bounded read-only production profile
        shell: python
        run: |
          import concurrent.futures
          import math
          import statistics
          import time
          import urllib.request

          ENDPOINTS = [
              "https://drkhaledbadran.com/health/",
              "https://drkhaledbadran.com/",
              "https://drkhaledbadran.com/en/",
              "https://drkhaledbadran.com/services/",
              "https://drkhaledbadran.com/en/services/",
              "https://drkhaledbadran.com/book/",
              "https://drkhaledbadran.com/en/book/",
              "https://drkhaledbadran.com/contact/",
          ]
          REQUESTS_PER_ENDPOINT = 6
          MAX_WORKERS = 4
          TIMEOUT_SECONDS = 10
          P95_LIMIT_SECONDS = 2.5
          MAX_SINGLE_REQUEST_SECONDS = 5.0

          targets = [
              url
              for url in ENDPOINTS
              for _ in range(REQUESTS_PER_ENDPOINT)
          ]

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "KBC-ProductionReadiness-BoundedLoad/1.0",
                      "Cache-Control": "no-cache",
                  },
                  method="GET",
              )
              started = time.perf_counter()
              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=TIMEOUT_SECONDS,
                  ) as response:
                      status = response.status
                      while response.read(65536):
                          pass
                  elapsed = time.perf_counter() - started
                  return url, status, elapsed, None
              except Exception as exc:
                  elapsed = time.perf_counter() - started
                  return url, None, elapsed, type(exc).__name__

          results = []
          with concurrent.futures.ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as pool:
              for result in pool.map(fetch, targets):
                  results.append(result)

          errors = [
              item for item in results
              if item[1] != 200 or item[3] is not None
          ]
          latencies = sorted(item[2] for item in results)
          p50 = statistics.median(latencies)
          p95 = latencies[math.ceil(len(latencies) * 0.95) - 1]
          max_latency = max(latencies)

          print(
              "profile=small-clinic-read-only "
              f"requests={len(results)} concurrency={MAX_WORKERS} "
              f"p50={p50:.3f}s p95={p95:.3f}s "
              f"max={max_latency:.3f}s errors={len(errors)}"
          )

          for url in ENDPOINTS:
              route_latencies = sorted(
                  item[2] for item in results if item[0] == url
              )
              route_p95 = route_latencies[
                  math.ceil(len(route_latencies) * 0.95) - 1
              ]
              print(
                  f"endpoint={url} requests={len(route_latencies)} "
                  f"p95={route_p95:.3f}s "
                  f"max={max(route_latencies):.3f}s"
              )

          if errors:
              for url, status, elapsed, error in errors[:10]:
                  print(
                      "::error title=Production GET failure::"
                      f"url={url} status={status} "
                      f"time={elapsed:.3f}s error={error}"
                  )
              raise SystemExit(1)

          if p95 > P95_LIMIT_SECONDS:
              print(
                  "::error title=Bounded production p95 exceeded::"
                  f"observed={p95:.3f}s "
                  f"limit={P95_LIMIT_SECONDS:.3f}s"
              )
              raise SystemExit(1)

          if max_latency > MAX_SINGLE_REQUEST_SECONDS:
              print(
                  "::error title=Bounded production max latency exceeded::"
                  f"observed={max_latency:.3f}s "
                  f"limit={MAX_SINGLE_REQUEST_SECONDS:.3f}s"
              )
              raise SystemExit(1)
