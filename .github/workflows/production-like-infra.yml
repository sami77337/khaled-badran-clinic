name: Production-like PostgreSQL Redis checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-like-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-redis:
    name: PostgreSQL + Redis integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kbc_ci
          POSTGRES_USER: kbc_ci
          POSTGRES_PASSWORD: kbc_ci_synthetic_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kbc_ci -d kbc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ci-synthetic-production-like-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      DATABASE_URL: postgresql://kbc_ci:kbc_ci_synthetic_password@127.0.0.1:5432/kbc_ci
      DATABASE_SSL_REQUIRE: "false"
      CACHE_URL: redis://127.0.0.1:6379/1
      DJANGO_CACHE_KEY_PREFIX: kbc-ci-production-like
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      BOOKING_TRUST_X_FORWARDED_FOR: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply migrations on PostgreSQL
        run: python manage.py migrate --noinput

      - name: Run production-like integration tests
        run: |
          python manage.py test \
            apps.booking.test_reschedule_concurrency \
            apps.whatsapp.test_concurrency \
            apps.booking.tests.PublicBookingRateLimitTests \
            apps.patients.tests.PatientPortalRateLimitTests \
            --noinput --verbosity 2
