name: One-off WhatsApp closeout apply

on:
  push:
    branches:
      - fix/clinic-phone-20260916

permissions:
  contents: write

jobs:
  apply-closeout:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-placeholder-not-a-secret
      DJANGO_DEBUG: "true"
      DJANGO_PRODUCTION: "false"
      DATABASE_URL: ""
      CACHE_URL: ""
      BOOKING_TRUST_X_FORWARDED_FOR: "false"
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/clinic-phone-20260916

      - name: Apply owner-approved closeout edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, *, expected=None):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, got {count}")
              if expected is None and count == 0:
                  raise SystemExit(f"{path}: replacement anchor not found")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # 1) Unify the public clinic phone/WhatsApp number.
          replace_exact(
              "apps/core/views.py",
              'APPROVED_CLINIC_PHONE = {\n    "display": "+962 7 8976 6332",\n    "e164": "+962789766332",\n    "whatsapp_url": "https://wa.me/962789766332",\n}',
              'APPROVED_CLINIC_PHONE = {\n    "display": "+962 7 9889 8510",\n    "e164": "+962798898510",\n    "whatsapp_url": "https://wa.me/962798898510",\n}',
              expected=1,
          )
          replace_exact("apps/core/tests.py", "+962 7 8976 6332", "+962 7 9889 8510")
          replace_exact("apps/core/tests.py", "962789766332", "962798898510")
          replace_exact("apps/booking/tests.py", "962789766332", "962798898510")

          # 2) Add the exact two-button bilingual fallback chooser.
          menu_anchor = '\n\ndef language_menu(language):\n'
          chooser = '''\n\ndef initial_language_menu():\n    return {\n        "type": "interactive",\n        "interactive": {\n            "type": "button",\n            "body": {"text": "اختر اللغة / Choose language"},\n            "action": {\n                "buttons": [\n                    {\n                        "type": "reply",\n                        "reply": {"id": "kbc_language_ar", "title": "العربية"},\n                    },\n                    {\n                        "type": "reply",\n                        "reply": {"id": "kbc_language_en", "title": "English"},\n                    },\n                ]\n            },\n        },\n    }\n'''
          p = Path("apps/whatsapp/menu.py")
          text = p.read_text(encoding="utf-8")
          if "def initial_language_menu():" in text:
              raise SystemExit("apps/whatsapp/menu.py: chooser already present")
          if text.count(menu_anchor) != 1:
              raise SystemExit("apps/whatsapp/menu.py: language_menu anchor mismatch")
          p.write_text(text.replace(menu_anchor, chooser + menu_anchor), encoding="utf-8")

          # 3) Explicit commands keep opening the saved-language menu; unknown text asks for language.
          replace_exact(
              "apps/whatsapp/webhook.py",
              '        if selection == "kbc_main_menu":\n',
              '        if command:\n            accepted = meta._send("+" + sender, menu.main_menu(language))\n        elif selection == "kbc_main_menu":\n',
              expected=1,
          )
          replace_exact(
              "apps/whatsapp/webhook.py",
              '            else:\n                accepted = meta._send("+" + sender, menu.main_menu(language))\n',
              '            else:\n                accepted = meta._send("+" + sender, menu.initial_language_menu())\n',
              expected=1,
          )

          # 4) Update webhook coverage: known menu command opens main menu; arbitrary text gets language chooser.
          replace_exact(
              "apps/whatsapp/test_webhook.py",
              '            self.post([self.message(text="private-payload-sentinel")]).status_code, 200\n',
              '            self.post([self.message(text="القائمة")]).status_code, 200\n',
              expected=1,
          )
          anchor = '        self.assertNotIn("private-payload-sentinel", json.dumps(content))\n\n    def test_invalid_timestamps_fail_without_processing_or_private_logs(self):\n'
          inserted = '''        self.assertNotIn("private-payload-sentinel", json.dumps(content))\n\n    def test_unknown_text_prompts_for_language_before_main_menu(self):\n        for index, text in enumerate((".", "مرحبا", "Hi", "private-payload-sentinel")):\n            with self.subTest(text=text):\n                cache.clear()\n                self.send.reset_mock()\n                self.assertEqual(\n                    self.post(\n                        [self.message(message_id=f"unknown-{index}", text=text)]\n                    ).status_code,\n                    200,\n                )\n                content = self.send.call_args.args[1]\n                self.assertEqual(content, menu.initial_language_menu())\n                buttons = content["interactive"]["action"]["buttons"]\n                self.assertEqual(\n                    [item["reply"]["id"] for item in buttons],\n                    ["kbc_language_ar", "kbc_language_en"],\n                )\n                self.assertEqual(\n                    [item["reply"]["title"] for item in buttons],\n                    ["العربية", "English"],\n                )\n                self.assertEqual(\n                    content["interactive"]["body"]["text"],\n                    "اختر اللغة / Choose language",\n                )\n                self.assertNotIn(text, json.dumps(content, ensure_ascii=False))\n\n    def test_text_language_choice_returns_matching_main_menu(self):\n        for index, (text, language) in enumerate((("العربية", "ar"), ("English", "en"))):\n            with self.subTest(text=text):\n                cache.clear()\n                self.send.reset_mock()\n                self.assertEqual(\n                    self.post(\n                        [self.message(message_id=f"language-text-{index}", text=text)]\n                    ).status_code,\n                    200,\n                )\n                self.assertEqual(self.send.call_args.args[1], menu.main_menu(language))\n\n    def test_invalid_timestamps_fail_without_processing_or_private_logs(self):\n'''
          replace_exact("apps/whatsapp/test_webhook.py", anchor, inserted, expected=1)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused closeout tests
        run: |
          python manage.py test apps.whatsapp apps.core.test_whatsapp_bot_link
          python manage.py test apps.core.tests apps.booking.tests

      - name: Remove one-off workflow and commit verified edits
        shell: bash
        run: |
          rm .github/workflows/oneoff-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize WhatsApp language fallback and clinic phone"
          git push origin HEAD:fix/clinic-phone-20260916
